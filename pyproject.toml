[project]
name = "tpwalk"
version = "0.3.0"
description = "TP-Link GPL source and firmware URL scraper, verifier, and downloader"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [
    { name = "StrongWind1" },
]
keywords = [
    "tp-link",
    "firmware",
    "gpl",
    "scraper",
    "downloader",
    "router",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2]",
    "beautifulsoup4",
    "lxml",
    "rich",
    "typer",
]

[project.scripts]
tpwalk = "tpwalk.cli:main"

[project.urls]
Repository = "https://github.com/StrongWind1/tpwalk"
Documentation = "https://strongwind1.github.io/tpwalk/"
Changelog = "https://github.com/StrongWind1/tpwalk/blob/main/CHANGELOG.md"
Issues = "https://github.com/StrongWind1/tpwalk/issues"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]
docs = [
    "mkdocs-material",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tpwalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 320

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # trailing comma — conflicts with ruff formatter
    "ISC001",   # implicit string concat — conflicts with ruff formatter
    "D203",     # blank line before class docstring — incompatible with D211
    "D213",     # multi-line summary second line — incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ALL"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
exclude = ["tests/"]
